name: Friedhofsender macOS Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Gradle-Wrapper Ausführungsrechte geben
        run: chmod +x gradlew

      - name: macOS App & DMG erstellen
        run: ./gradlew :desktop:package

      - name: macOS Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Friedhofsender-macOS-Binaries
          path: desktop/build/compose/binaries/main/